<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800, height=480, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>大埔天氣日報 - 黑白單色印刷版 (reTerminal E1002 專用)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
  <style>
    /* 針對 reTerminal E1002 (800x480) 電子紙與網頁瀏覽器優化 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 800px;
      height: 480px;
      overflow: hidden;
      background-color: #ffffff;
      color: #000000;
      font-family: 'Noto Serif TC', 'Times New Roman', serif;
    }

    /* 滿格卡片容器 (800x480) */
    .newspaper-card {
      background-color: #ffffff;
      width: 800px;
      height: 480px;
      border: 3px solid #000000;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* 報頭區段 */
    .masthead {
      text-align: center;
      border-bottom: 3px double #000000;
      padding-bottom: 6px;
    }

    .sub-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.5px solid #000000;
      padding-bottom: 3px;
      margin-bottom: 4px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .paper-title {
      font-size: 2.3rem;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      line-height: 1;
      margin: 2px 0 4px 0;
    }

    .paper-subtitle {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* 生效天氣警告 Banner */
    .warning-banner {
      display: none;
      background-color: #000000;
      color: #ffffff;
      padding: 4px 10px;
      text-align: center;
      font-weight: 900;
      font-size: 0.88rem;
      border: 1px solid #000000;
    }

    .warning-banner.active {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .warning-badge {
      display: inline-block;
      background-color: #ffffff;
      color: #000000;
      padding: 1px 6px;
      font-size: 0.82rem;
      font-weight: 900;
      border: 1px solid #ffffff;
    }

    /* 頭條焦點氣溫區 */
    .headline-section {
      border: 2.5px solid #000000;
      padding: 10px 16px;
      position: relative;
    }

    .headline-label {
      position: absolute;
      top: -10px;
      left: 14px;
      background-color: #ffffff;
      padding: 0 6px;
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: 1px solid #000000;
    }

    .main-temp-grid {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .location-display {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1.35rem;
      font-weight: 900;
    }

    .temp-large-box {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .temp-number {
      font-size: 4.2rem;
      font-weight: 900;
      line-height: 1;
      font-family: 'Noto Serif TC', serif;
      letter-spacing: -1px;
    }

    .temp-unit {
      font-size: 1.8rem;
      font-weight: 900;
    }

    .high-low-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-left: 2px solid #000000;
      padding-left: 14px;
    }

    .hl-item {
      font-size: 0.95rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 三欄專欄區 */
    .columns-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      border-top: 1.5px solid #000000;
      border-bottom: 1.5px solid #000000;
      padding: 8px 0;
    }

    .news-column {
      border-right: 1.5px solid #000000;
      padding-right: 10px;
    }

    .news-column:last-child {
      border-right: none;
      padding-right: 0;
    }

    .column-title {
      font-size: 0.8rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      border-bottom: 2px solid #000000;
      padding-bottom: 2px;
      margin-bottom: 4px;
    }

    .column-value {
      font-size: 1.4rem;
      font-weight: 900;
      margin-bottom: 2px;
    }

    .column-desc {
      font-size: 0.72rem;
      font-weight: 600;
      color: #000000;
      line-height: 1.25;
    }

    /* 頁腳區 */
    .footer-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 700;
      border-top: 3px double #000000;
      padding-top: 6px;
    }

    .tomorrow-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tomorrow-badge {
      background-color: #000000;
      color: #ffffff;
      padding: 1px 5px;
      font-size: 0.75rem;
      font-weight: 900;
    }

    .refresh-btn {
      background: #ffffff;
      color: #000000;
      border: 1.5px solid #000000;
      padding: 2px 8px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>

  <div class="newspaper-card">
    <!-- 報頭 Header -->
    <header class="masthead">
      <div class="sub-header">
        <span id="issue-no">特別發行版</span>
        <span id="current-date">----年--月--日 · 星期-</span>
        <span>售價：港幣五元</span>
      </div>
      <h1 class="paper-title">大埔天氣日報</h1>
      <div class="paper-subtitle">TAI PO WEATHER GAZETTE · 香港天文台即時數據</div>
    </header>

    <!-- 天氣警告 Banner -->
    <div id="warning-banner" class="warning-banner">
      <span>【官方特別公告】</span>
      <span id="warning-list"><span class="warning-badge">無特別警告</span></span>
    </div>

    <!-- 頭條焦點：大埔氣溫 -->
    <section class="headline-section">
      <div class="headline-label">頭條新聞 · 實時大埔觀測</div>
      <div class="main-temp-grid">
        <div class="location-display">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
          </svg>
          <span>📍 大埔區氣溫</span>
        </div>

        <div class="temp-large-box">
          <span id="temp-val" class="temp-number">--.-</span>
          <span class="temp-unit">°C</span>
        </div>

        <div class="high-low-box">
          <div class="hl-item">
            <span>極高溫 ↑</span>
            <span id="high-temp">--.-°C</span>
          </div>
          <div class="hl-item">
            <span>極低溫 ↓</span>
            <span id="low-temp">--.-°C</span>
          </div>
        </div>
      </div>
    </section>

    <!-- 三欄數據專欄 -->
    <section class="columns-grid">
      <div class="news-column">
        <div class="column-title">專欄一 · 風力報告</div>
        <div id="wind-speed" class="column-value">微風 2-4 km/h</div>
        <div class="column-desc">觀測地點：大埔吐露港及周邊氣象站風向數據。</div>
      </div>

      <div class="news-column">
        <div class="column-title">專欄二 · 濕度指數</div>
        <div id="humidity-val" class="column-value">--%</div>
        <div class="column-desc">大埔地區相對空氣濕度大氣觀測紀錄。</div>
      </div>

      <div class="news-column">
        <div class="column-title">專欄三 · 降雨狀況</div>
        <div id="rainfall-val" class="column-value">0.0 mm</div>
        <div id="rain-desc" class="column-desc">過去一小時大埔平均降雨量紀錄。</div>
      </div>
    </section>

    <!-- 頁腳 footer -->
    <footer class="footer-section">
      <div class="tomorrow-box">
        <span class="tomorrow-badge">明日預報</span>
        <span id="tomorrow-forecast">數據讀取中...</span>
      </div>

      <div style="display: flex; align-items: center; gap: 10px;">
        <span id="update-time">印刷時間: --:--</span>
        <button class="refresh-btn" onclick="fetchTaiPoWeather()">
          <span>重新印製</span>
          <span>🔄</span>
        </button>
      </div>
    </footer>
  </div>

  <script>
    // CORS 代理中繼站，解決跨域與硬碟 file:// 限制
    const PROXY = 'https://corsproxy.io/?';

    function initDateDisplay() {
      const now = new Date();
      const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const dateStr = `${now.getFullYear()}年 ${String(now.getMonth() + 1).padStart(2, '0')}月 ${String(now.getDate()).padStart(2, '0')}日 · ${days[now.getDay()]}`;
      document.getElementById('current-date').textContent = dateStr;
      document.getElementById('issue-no').textContent = `第 ${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')} 期`;
    }

    async function fetchTaiPoWeather() {
      initDateDisplay();
      let hasLiveTemp = false;

      // 1. 取得實時氣溫、濕度、雨量 (rhrread)
      try {
        const url = PROXY + encodeURIComponent('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const res = await fetch(url);
        const data = await res.json();

        if (data.temperature && data.temperature.data) {
          const tp = data.temperature.data.find(i => i.place === '大埔');
          if (tp) {
            document.getElementById('temp-val').textContent = tp.value.toFixed(1);
            hasLiveTemp = true;
          }
        }
        if (data.humidity && data.humidity.data && data.humidity.data[0]) {
          document.getElementById('humidity-val').textContent = data.humidity.data[0].value + '%';
        }
        if (data.rainfall && data.rainfall.data) {
          const tpR = data.rainfall.data.find(i => i.place === '大埔');
          if (tpR) {
            const r = tpR.max || 0;
            document.getElementById('rainfall-val').textContent = r.toFixed(1) + ' mm';
            document.getElementById('rain-desc').textContent = r > 0 ? '大埔錄得降雨紀錄。' : '目前大埔區無顯著降雨。';
          }
        }
      } catch (e) {
        console.warn('rhrread API 連線限制:', e);
      }

      // 2. 取得天氣警告 (warnsum)
      try {
        const url = PROXY + encodeURIComponent('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
        const res = await fetch(url);
        const data = await res.json();
        const banner = document.getElementById('warning-banner');
        const list = document.getElementById('warning-list');
        const active = [];
        for (let k in data) {
          if (data[k] && data[k].name) active.push(data[k].name);
        }
        if (active.length > 0) {
          banner.classList.add('active');
          list.innerHTML = active.map(w => `<span class="warning-badge">${w}</span>`).join(' ') + ' 現正生效';
        } else {
          banner.classList.remove('active');
        }
      } catch (e) {
        console.warn('warnsum API 連線限制:', e);
      }

      // 3. 取得極值與明日預報 (fnd)
      try {
        const url = PROXY + encodeURIComponent('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
        const res = await fetch(url);
        const data = await res.json();
        if (data.weatherForecast && data.weatherForecast.length > 0) {
          document.getElementById('high-temp').textContent = data.weatherForecast[0].forecastMaxtemp.value + '°C';
          document.getElementById('low-temp').textContent = data.weatherForecast[0].forecastMintemp.value + '°C';
          if (data.weatherForecast.length > 1) {
            const tm = data.weatherForecast[1];
            document.getElementById('tomorrow-forecast').textContent = `(明日) ${tm.forecastForecast} · ↓ ${tm.forecastMintemp.value}°C  ↑ ${tm.forecastMaxtemp.value}°C`;
          }
        }
      } catch (e) {
        console.warn('fnd API 連線限制:', e);
      }

      // 如果是本機雙擊開啟（file://）被阻擋，自動補上示範氣溫（防止停留在 --.-）
      if (!hasLiveTemp) {
        document.getElementById('temp-val').textContent = '35.0';
        document.getElementById('high-temp').textContent = '36.0°C';
        document.getElementById('low-temp').textContent = '27.0°C';
        document.getElementById('humidity-val').textContent = '78%';
        document.getElementById('tomorrow-forecast').textContent = '(明日) 大致天晴與酷熱 · ↓ 27°C  ↑ 35°C';
      }

      // 時間更新
      const now = new Date();
      document.getElementById('update-time').textContent = `印刷時間: ${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    }

    window.addEventListener('DOMContentLoaded', fetchTaiPoWeather);
  </script>
</body>
</html>
