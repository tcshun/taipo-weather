<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大埔天氣日報 - E1002 超清晰滿版</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* 針對 reTerminal E1002 (800x480) 螢幕100%滿版無邊界調校 */
    html, body {
      width: 800px;
      height: 480px;
      overflow: hidden;
      background-color: #ffffff;
      color: #000000;
      font-family: 'Noto Serif TC', 'Microsoft JhengHei', serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .newspaper-card {
      background-color: #ffffff;
      width: 800px;
      height: 480px;
      border: 4px solid #000000;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 報頭區段 */
    .masthead {
      text-align: center;
      border-bottom: 4px double #000000;
      padding-bottom: 4px;
    }

    .sub-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #000000;
      padding-bottom: 2px;
      margin-bottom: 4px;
      font-size: 1.15rem;
      font-weight: 900;
    }

    .paper-title {
      font-size: 3.1rem;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      line-height: 1;
      margin: 2px 0;
    }

    .paper-subtitle {
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 2px;
    }

    /* 天氣警告聲明區 */
    .warning-banner {
      display: none;
      background-color: #000000;
      color: #ffffff;
      padding: 5px 12px;
      text-align: center;
      font-weight: 900;
      font-size: 1.2rem;
      border: 2px solid #000000;
    }

    .warning-banner.active {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    .warning-badge {
      background-color: #ffffff;
      color: #000000;
      padding: 2px 8px;
      font-size: 1.15rem;
      font-weight: 900;
      border: 1px solid #ffffff;
    }

    /* 頭條氣溫核心區 */
    .headline-section {
      border: 3.5px solid #000000;
      padding: 8px 16px;
      position: relative;
      margin: 2px 0;
    }

    .headline-label {
      position: absolute;
      top: -12px;
      left: 14px;
      background-color: #ffffff;
      padding: 0 8px;
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 1px;
      border: 2px solid #000000;
    }

    .main-temp-grid {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .location-display {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.65rem;
      font-weight: 900;
    }

    .temp-large-box {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .temp-number {
      font-size: 5.2rem;
      font-weight: 900;
      line-height: 1;
    }

    .temp-unit {
      font-size: 2.5rem;
      font-weight: 900;
    }

    .high-low-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-left: 3.5px solid #000000;
      padding-left: 18px;
    }

    .hl-item {
      font-size: 1.35rem;
      font-weight: 900;
      display: flex;
      gap: 10px;
    }

    /* 三欄報紙專欄 */
    .columns-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      border-top: 2.5px solid #000000;
      border-bottom: 2.5px solid #000000;
      padding: 8px 0;
    }

    .news-column {
      border-right: 2.5px solid #000000;
      padding-right: 12px;
    }

    .news-column:last-child {
      border-right: none;
      padding-right: 0;
    }

    .column-title {
      font-size: 1.25rem;
      font-weight: 900;
      border-bottom: 2px solid #000000;
      padding-bottom: 2px;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    .column-value {
      font-size: 2.1rem;
      font-weight: 900;
      margin-bottom: 2px;
    }

    .column-desc {
      font-size: 1.15rem;
      font-weight: 900;
      line-height: 1.2;
      color: #000000;
    }

    /* 頁腳 */
    .footer-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 4px double #000000;
      padding-top: 6px;
      font-size: 1.15rem;
      font-weight: 900;
    }

    .tomorrow-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tomorrow-badge {
      background-color: #000000;
      color: #ffffff;
      padding: 2px 8px;
      font-size: 1.05rem;
      font-weight: 900;
    }
  </style>
</head>
<body>
  <div class="newspaper-card">
    <!-- 報頭 -->
    <header class="masthead">
      <div class="sub-header">
        <span id="issue-no">特別發行版</span>
        <span id="current-date">載入中...</span>
        <span>售價：港幣五元</span>
      </div>
      <h1 class="paper-title">大埔天氣日報</h1>
      <div class="paper-subtitle">TAI PO WEATHER GAZETTE · 香港天文台即時數據</div>
    </header>

    <!-- 生效警告標籤 -->
    <div id="warning-banner" class="warning-banner">
      <span>【官方特別公告】</span>
      <span id="warning-list"><span class="warning-badge">無特別警告</span></span>
    </div>

    <!-- 頭條焦點 -->
    <section class="headline-section">
      <div class="headline-label">頭條新聞 · 實時大埔觀測</div>
      <div class="main-temp-grid">
        <div class="location-display">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
          </svg>
          <span>📍 大埔區氣溫</span>
        </div>
        <div class="temp-large-box">
          <span id="temp-val" class="temp-number">36.0</span>
          <span class="temp-unit">°C</span>
        </div>
        <div class="high-low-box">
          <div class="hl-item"><span>最高 ↑</span><span id="high-temp">36°C</span></div>
          <div class="hl-item"><span>最低 ↓</span><span id="low-temp">29°C</span></div>
        </div>
      </div>
    </section>

    <!-- 三欄數據專欄 -->
    <section class="columns-grid">
      <div class="news-column">
        <div class="column-title">專欄一 · 風力報告</div>
        <div id="wind-speed" class="column-value">微風 2-4 km/h</div>
        <div class="column-desc">大埔吐露港觀測站</div>
      </div>
      <div class="news-column">
        <div class="column-title">專欄二 · 濕度指數</div>
        <div id="humidity-val" class="column-value">63%</div>
        <div class="column-desc">大埔相對濕度紀錄</div>
      </div>
      <div class="news-column">
        <div class="column-title">專欄三 · 降雨狀況</div>
        <div id="rainfall-val" class="column-value">0.0 mm</div>
        <div id="rain-desc" class="column-desc">目前大埔無降雨</div>
      </div>
    </section>

    <!-- 頁腳 -->
    <footer class="footer-section">
      <div class="tomorrow-box">
        <span class="tomorrow-badge">明日預報</span>
        <span id="tomorrow-forecast">大致天晴及酷熱 · ↓ 28°C ↑ 35°C</span>
      </div>
      <span id="update-time">印刷時間: 載入中...</span>
    </footer>
  </div>

  <script>
    // 免費 CORS 代理，解決雲端伺服器與天文台封鎖問題
    const PROXY = 'https://corsproxy.io/?';

    function initDateDisplay() {
      const now = new Date();
      const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      document.getElementById('current-date').textContent = `${now.getFullYear()}年 ${String(now.getMonth() + 1).padStart(2, '0')}月 ${String(now.getDate()).padStart(2, '0')}日 · ${days[now.getDay()]}`;
      document.getElementById('issue-no').textContent = `第 ${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')} 期`;
    }

    async function fetchTaiPoWeather() {
      initDateDisplay();
      
      let apiSuccess = false;

      // 1. 取得實時氣溫、濕度、雨量 (rhrread)
      try {
        const url = PROXY + encodeURIComponent('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const res = await fetch(url);
        const data = await res.json();

        if (data.temperature && data.temperature.data) {
          const tp = data.temperature.data.find(i => i.place === '大埔');
          if (tp) {
            document.getElementById('temp-val').textContent = tp.value.toFixed(1);
            apiSuccess = true;
          }
        }
        if (data.humidity && data.humidity.data && data.humidity.data[0]) {
          document.getElementById('humidity-val').textContent = data.humidity.data[0].value + '%';
        }
        if (data.rainfall && data.rainfall.data) {
          const tpR = data.rainfall.data.find(i => i.place === '大埔');
          if (tpR) {
            const r = tpR.max || 0;
            document.getElementById('rainfall-val').textContent = r.toFixed(1) + ' mm';
            document.getElementById('rain-desc').textContent = r > 0 ? '錄得顯著降雨' : '目前大埔無降雨';
          }
        }
      } catch (e) {
        console.warn('rhrread API 連線警告:', e);
      }

      // 2. 取得天氣警告 (warnsum)
      try {
        const url = PROXY + encodeURIComponent('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
        const res = await fetch(url);
        const data = await res.json();
        const banner = document.getElementById('warning-banner');
        const list = document.getElementById('warning-list');
        const active = [];
        for (let k in data) {
          if (data[k] && data[k].name) active.push(data[k].name);
        }
        if (active.length > 0) {
          banner.classList.add('active');
          list.innerHTML = active.map(w => `<span class="warning-badge">${w}</span>`).join(' ') + ' 現正生效';
        } else {
          banner.classList.remove('active');
        }
      } catch (e) {
        console.warn('warnsum API 連線警告:', e);
      }

      // 3. 取得極值與明日預報 (fnd)
      try {
        const url = PROXY + encodeURIComponent('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
        const res = await fetch(url);
        const data = await res.json();
        if (data.weatherForecast && data.weatherForecast.length > 0) {
          document.getElementById('high-temp').textContent = data.weatherForecast[0].forecastMaxtemp.value + '°C';
          document.getElementById('low-temp').textContent = data.weatherForecast[0].forecastMintemp.value + '°C';
          
          if (data.weatherForecast.length > 1) {
            const tm = data.weatherForecast[1];
            const weatherDesc = (tm.forecastWeather || tm.forecastForecast || '大致天晴').replace(/。/g, '');
            document.getElementById('tomorrow-forecast').textContent = `${weatherDesc} · ↓ ${tm.forecastMintemp.value}°C ↑ ${tm.forecastMaxtemp.value}°C`;
          }
        }
      } catch (e) {
        console.warn('fnd API 連線警告:', e);
      }

      // 本機或網路極端狀況下的備用數值 (Fallback)
      if (!apiSuccess) {
        document.getElementById('temp-val').textContent = '36.0';
        document.getElementById('high-temp').textContent = '36°C';
        document.getElementById('low-temp').textContent = '29°C';
        document.getElementById('humidity-val').textContent = '63%';
        document.getElementById('tomorrow-forecast').textContent = '大致天晴及酷熱 · ↓ 28°C ↑ 35°C';
      }

      // 更新時間戳記
      const now = new Date();
      document.getElementById('update-time').textContent = `印刷時間: ${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    }

    window.addEventListener('DOMContentLoaded', fetchTaiPoWeather);
  </script>
</body>
</html>
